name: Homebrew cask

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_DEVELOPER: "1"
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publisher contracts
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Verify candidate against the immutable public release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/publish.py prepare-current
      - name: Audit, install, verify and uninstall only in disposable CI
        run: bash scripts/verify-install.sh
